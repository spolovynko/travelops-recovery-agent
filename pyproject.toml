[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "travelops-recovery-agent"
version = "0.1.0"
description = "A learning-first recovery agent for synthetic airline disruptions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1,<2",
    "fastapi>=0.141.1",
    "langchain-core>=1.2,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary]>=3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "hatchling>=1.27,<2",
    "httpx2>=2.10.0",
    "mypy>=1.15,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travelops_recovery_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
minversion = "9.0.3"
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
testpaths = ["tests"]
markers = [
    "integration: requires the isolated real PostgreSQL test database",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
